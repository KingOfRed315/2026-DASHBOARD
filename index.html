<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SĨ TỬ 2026 - DASHBOARD</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-navbar">
        <div class="nav-logo">SĨ TỬ 2026 🎓</div>
        <div class="nav-links">
            <button class="nav-btn active" onclick="switchTab('clock-tool')">Bộ đếm giờ</button>
            <button class="nav-btn" onclick="switchTab('docs-tool')">Kho tài liệu</button>
        </div>
    </nav>

    <main id="main-content">
        <section id="clock-tool" class="tab-content active">
            <div class="grid-layout">
                <div class="card panel-left">
                    <div class="sub-nav">
                        <button class="sub-item active" onclick="showFocus('sw')">BẤM GIỜ</button>
                        <button class="sub-item" onclick="showFocus('tm')">HẸN GIỜ</button>
                    </div>

                    <div id="sw-box" class="focus-area active">
                        <div class="display"><span id="sw-m">00</span>:<span id="sw-s">00</span><small id="sw-ms">.00</small></div>
                        <div class="btns">
                            <button class="btn primary" onclick="toggleSW()" id="sw-btn">BẮT ĐẦU</button>
                            <button class="btn" onclick="resetSW()">MỚI</button>
                        </div>
                    </div>

                    <div id="tm-box" class="focus-area">
                        <div class="tm-inputs">
                            <div class="in-item"><label>HH</label><input type="number" id="in-h" placeholder="00"></div>
                            <div class="in-item"><label>MM</label><input type="number" id="in-m" placeholder="00"></div>
                            <div class="in-item"><label>SS</label><input type="number" id="in-s" placeholder="00"></div>
                        </div>
                        <div class="display"><span id="tm-h">00</span>:<span id="tm-m">00</span>:<span id="tm-s">00</span></div>
                        <div class="btns">
                            <button class="btn primary" onclick="toggleTM()" id="tm-btn">KÍCH HOẠT</button>
                            <button class="btn" onclick="resetTM()">HỦY</button>
                        </div>
                    </div>
                </div>

                <div class="card panel-right">
                    <div class="real-time" id="clock">00:00:00</div>
                    <div class="exam-list">
                        <div class="exam-item">
                            <p>ĐGNL V-ACT (24/05/2026)</p>
                            <div class="cd-box" id="cd-act">00 : 00 : 00 : 00</div>
                        </div>
                        <div class="exam-item">
                            <p>THPT QUỐC GIA (11/06/2026)</p>
                            <div class="cd-box" id="cd-thpt">00 : 00 : 00 : 00</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="docs-tool" class="tab-content">
            <div class="docs-grid">
                <div class="doc-card">
                    <h3>TOÁN HỌC 📐</h3>
                    <div class="add-box">
                        <input type="text" id="name-toan" placeholder="Tên...">
                        <input type="text" id="link-toan" placeholder="Link...">
                        <button class="add-btn" onclick="addLink('toan')">
    <svg viewBox="0 0 24 24" width="20" height="20">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/>
    </svg>
</button>
                    </div>
                    <div id="list-toan" class="link-list"></div>
                </div>
                <div class="doc-card">
                    <h3>NGỮ VĂN 📖</h3>
                    <div class="add-box">
                        <input type="text" id="name-van" placeholder="Tên...">
                        <input type="text" id="link-van" placeholder="Link...">
                        <button class="add-btn" onclick="addLink('van')">
    <svg viewBox="0 0 24 24" width="20" height="20">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/>
    </svg>
</button>
                    </div>
                    <div id="list-van" class="link-list"></div>
                </div>
                <div class="doc-card">
                    <h3>TIẾNG ANH 🌍</h3>
                    <div class="add-box">
                        <input type="text" id="name-anh" placeholder="Tên...">
                        <input type="text" id="link-anh" placeholder="Link...">
                        <button class="add-btn" onclick="addLink('anh')">
    <svg viewBox="0 0 24 24" width="20" height="20">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/>
    </svg>
</button>
                    </div>
                    <div id="list-anh" class="link-list"></div>
                </div>
                <div class="doc-card">
                    <h3>TIN HỌC 💻</h3>
                    <div class="add-box">
                        <input type="text" id="name-tin" placeholder="Tên...">
                        <input type="text" id="link-tin" placeholder="Link...">
                        <button class="add-btn" onclick="addLink('tin')">
    <svg viewBox="0 0 24 24" width="20" height="20">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/>
    </svg>
</button>
                    </div>
                    <div id="list-tin" class="link-list"></div>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
